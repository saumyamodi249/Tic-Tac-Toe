<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Squircle Border with Gradient -->
  <rect x="2" y="2" width="96" height="96" rx="26" fill="url(#borderGrad)" />
  <!-- Inner Dark Background -->
  <rect x="5" y="5" width="90" height="90" rx="23" fill="#090e17" />
  <!-- Loop 1: Outer Cyan Ring -->
  <circle cx="50" cy="50" r="32" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />
  <!-- Loop 2: Middle Rose Ring -->
  <circle cx="50" cy="50" r="21" stroke="#fb7185" stroke-width="5" stroke-linecap="round" />
  <!-- Loop 3: Center Glowing Cyan Dot -->
  <circle cx="50" cy="50" r="8.5" fill="#38bdf8" filter="url(#glow)" />
</svg>
